<!DOCTYPE html><html lang="pt-BR"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação de Idade</title>
  <meta name="description" content="Verificação de idade para acesso ao conteúdo.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700;800&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="gate-shell">
    <div class="gate-texture" aria-hidden="true"></div>

    <section class="gate-panel" aria-labelledby="age-title">
      <h1 id="age-title">Confirme sua idade</h1>
      <p class="gate-copy">
        Para acessar este conteúdo, informe sua data de nascimento.
        A verificação acontece nesta etapa antes do redirecionamento.
      </p>

      <form class="age-form" id="age-form" novalidate="">
        <div class="field-wrap">
          <label for="birth-date">Data de nascimento</label>
          <div class="date-field" id="date-field-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <input id="birth-date" name="birth-date" type="date" min="1900-01-01" aria-describedby="age-note" required="">
          </div>
          <p id="age-note" class="field-note">Você precisa ter 18 anos ou mais.</p>
        </div>

        <p id="age-error" class="form-error" role="alert" style="display:none">
          <span class="form-error__dot" aria-hidden="true"></span>
          <span id="age-error-text"></span>
        </p>

        <button type="submit" class="continue-button" id="continue-btn">
          <span id="btn-text">Continuar</span>
          <svg id="btn-icon-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline>
          </svg>
          <svg id="btn-icon-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </form>

      <div class="trust-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
        <span>Sua data é usada somente para esta verificação.</span>
      </div>
    </section>

    <footer class="gate-footer">
      <span>© 2026 — Experiência de passagem segura</span>
      <a href="../inicio/index.html" target="_blank" rel="noreferrer">
        Central de anúncios
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>
    </footer>
  </main>

  <script src="js/script.js"></script>


</body></html>
